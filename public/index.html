<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="common.appName">书签导航</title>
    <meta
      name="description"
      content="一个面向日常访问的导航网站，支持搜索、分类浏览、菜单工具和书签维护。"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link
      rel="stylesheet"
      href="/css/workspace-refresh.css?v=nav-20260919-vivid-cards"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body class="nav-site">
    <div class="container nav-shell">
      <div
        data-site-header
        data-page-key="home"
        data-require-auth="false"
        data-logo-icon="N"
        data-logo-text="书签导航"
        data-logo-subtitle="你的常用站点入口"
        class="header nav-header"
      ></div>
      <button id="darkModeToggle" class="dark-mode-toggle" title="切换深色/浅色模式" type="button">🌙</button>

      <main class="main-content home-content nav-home">
        <section class="nav-hero" aria-labelledby="homeHeroTitle">
          <div class="nav-hero-copy">
            <p class="nav-hero-kicker" data-i18n="home.heroKicker">
              BOOKMARK WORKSPACE
            </p>
            <h1 id="homeHeroTitle" data-i18n="home.heroTitle">
              把常用网站，放在一个清爽的入口
            </h1>
            <p class="nav-hero-description" data-i18n="home.heroCopy">
              快速搜索、按分类浏览，找到你下一步要打开的站点。
            </p>
          </div>
          <div class="nav-hero-note" aria-label="搜索快捷键">
            <span class="nav-hero-note-label" data-i18n="home.shortcutLabel">
              快捷搜索
            </span>
            <span class="nav-hero-note-key">Ctrl</span>
            <span class="nav-hero-note-plus">+</span>
            <span class="nav-hero-note-key">K</span>
            <span class="nav-hero-note-hint" data-i18n="home.shortcutHint">
              聚焦搜索框
            </span>
          </div>
        </section>

        <section class="nav-toolbar" aria-label="搜索、筛选和统计">
          <div
            id="searchContainer"
            class="search-container nav-search-container"
          >
            <div class="search-box nav-search-box">
              <input
                type="text"
                id="searchInput"
                placeholder="搜索标题、描述、网址..."
                data-i18n-placeholder="search.placeholder"
                class="search-input"
              />
              <button
                id="searchBtn"
                class="search-btn"
                data-i18n="search.action"
                type="button"
              >
                搜索
              </button>
              <button
                id="clearSearchBtn"
                class="search-btn clear-btn"
                data-i18n="common.clear"
                type="button"
              >
                清除
              </button>
            </div>
          </div>

          <div class="nav-filter-row">
            <label class="filter-group">
              <span class="filter-label" data-i18n="filter.categoryLabel">
                分类
              </span>
              <select id="categoryFilter" class="filter-select">
                <option value="" data-i18n="filter.allCategories">
                  全部分类
                </option>
              </select>
            </label>
            <label class="filter-group">
              <span class="filter-label" data-i18n="filter.sortLabel">
                排序
              </span>
              <select id="sortSelect" class="filter-select">
                <option value="created_at:desc" data-i18n="filter.newest">
                  最新收录
                </option>
                <option value="popularity:desc" data-i18n="filter.popular">
                  最常用
                </option>
                <option value="visit_count:desc" data-i18n="filter.mostVisited">
                  访问最多
                </option>
                <option
                  value="last_visited:desc"
                  data-i18n="filter.recentVisited"
                >
                  最近访问
                </option>
                <option value="title:asc" data-i18n="filter.titleAZ">
                  标题 A-Z
                </option>
                <option value="title:desc" data-i18n="filter.titleZA">
                  标题 Z-A
                </option>
                <option
                  value="updated_at:desc"
                  data-i18n="filter.recentUpdated"
                >
                  最近更新
                </option>
                <option value="created_at:asc" data-i18n="filter.oldest">
                  最早收录
                </option>
              </select>
            </label>
            <div class="view-controls" role="group" aria-label="视图切换">
              <button
                id="gridViewBtn"
                class="view-btn active"
                title="网格视图"
                data-i18n-title="filter.gridView"
                type="button"
              >
                <span class="icon" aria-hidden="true">▦</span>
                <span class="view-label" data-i18n="filter.gridShort">
                  网格
                </span>
              </button>
              <button
                id="listViewBtn"
                class="view-btn"
                title="列表视图"
                data-i18n-title="filter.listView"
                type="button"
              >
                <span class="icon" aria-hidden="true">☰</span>
                <span class="view-label" data-i18n="filter.listShort">
                  列表
                </span>
              </button>
            </div>
          </div>

          <div class="stats-bar nav-stats">
            <div class="stats-item">
              <span class="stats-label" data-i18n="stats.total">
                站点总数
              </span>
              <span id="totalCount" class="stats-value">0</span>
            </div>
            <div class="stats-item">
              <span class="stats-label" data-i18n="stats.currentPage">
                当前范围
              </span>
              <span id="currentPageInfo" class="stats-value">0</span>
            </div>
          </div>
        </section>

        <section class="nav-category-panel" aria-labelledby="categoryPanelTitle">
          <div class="nav-section-label-row">
            <p id="categoryPanelTitle" class="nav-section-label" data-i18n="home.categoryKicker">
              按分类探索
            </p>
            <span class="nav-section-label-line" aria-hidden="true"></span>
          </div>
          <nav
            id="categoryRail"
            class="category-rail"
            aria-label="分类快速筛选"
          ></nav>
        </section>

        <section
          id="directory"
          class="nav-directory"
          aria-labelledby="directoryTitle"
        >
          <div class="nav-directory-title">
            <div class="nav-directory-heading">
              <p class="nav-kicker" data-i18n="home.bookmarksKicker">
                导航目录
              </p>
              <h2 id="directoryTitle" data-i18n="home.bookmarksTitle">
                常用站点
              </h2>
              <p data-i18n="home.bookmarksCopy">
                所有站点按当前筛选条件展示，点击网址直接访问。
              </p>
            </div>
            <span class="nav-directory-rule" aria-hidden="true"></span>
          </div>
          <div
            id="bookmarksGrid"
            class="bookmarks-grid nav-bookmarks-grid"
          ></div>
        </section>

        <div id="loadingState" class="loading-state hidden">
          <div class="loading-spinner"></div>
          <p data-i18n="common.loading">加载中...</p>
        </div>
        <div id="emptyState" class="empty-state hidden">
          <div class="empty-icon">+</div>
          <h3 data-i18n="empty.noBookmarks">还没有站点</h3>
          <p data-i18n="empty.noBookmarksHint">
            登录后台后，可以在书签管理里添加第一个导航链接。
          </p>
        </div>
        <div id="errorState" class="error-state hidden">
          <div class="error-icon">!</div>
          <h3 data-i18n="common.loadFailed">加载失败</h3>
          <p id="errorMessage" data-i18n="home.loadFailedMessage">
            站点目录加载失败。
          </p>
          <button
            id="retryBtn"
            class="btn btn-primary"
            data-i18n="common.retry"
            type="button"
          >
            重试
          </button>
        </div>
        <div
          id="paginationContainer"
          class="pagination-container hidden"
          aria-hidden="true"
        >
          <div class="pagination">
            <button id="prevPageBtn" class="pagination-btn" disabled>
              <span class="icon" aria-hidden="true">&lt;</span>
              <span data-i18n="pagination.prev">上一页</span>
            </button>
            <div id="pageNumbers" class="page-numbers"></div>
            <button id="nextPageBtn" class="pagination-btn" disabled>
              <span data-i18n="pagination.next">下一页</span>
              <span class="icon" aria-hidden="true">&gt;</span>
            </button>
          </div>
        </div>
      </main>
    </div>

    <div id="messageContainer" class="message-container hidden">
      <div id="messageText" class="message-text"></div>
    </div>

    <script src="/js/home/i18n.js?v=nav-20260919-home-refactor"></script>
    <script src="/js/home/storage.js?v=nav-20260602-public-home"></script>
    <script src="/js/shared/api.js?v=nav-20260602-shared-runtime"></script>
    <script src="/js/home/sorting.js?v=nav-20260601-home-split"></script>
    <script src="/js/home/dom-helper.js?v=nav-20260601-home-split"></script>
    <script src="/js/home/ui-helper.js?v=nav-20260602-confirm-dialog"></script>
    <script src="/js/home/bookmarks.js?v=nav-20260919-vivid-cards"></script>
    <script src="/js/home/ui-enhancements.js?v=nav-20260601-home-split"></script>
    <script src="/js/shared/site-menu.js?v=nav-20260605-admin-menu"></script>
    <script src="/js/home/app.js?v=nav-20260919-home-refactor"></script>
    <script>
      // Dark mode toggle
      (function() {
        const saved = localStorage.getItem('nav-dark-mode');
        if (saved === 'dark' || (saved === null && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        document.addEventListener('DOMContentLoaded', () => {
          const btn = document.getElementById('darkModeToggle');
          if (!btn) return;
          const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          btn.textContent = isDark ? '☀️' : '🌙';
          btn.addEventListener('click', () => {
            const nowDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (nowDark) {
              document.documentElement.removeAttribute('data-theme');
              localStorage.setItem('nav-dark-mode', 'light');
              btn.textContent = '🌙';
            } else {
              document.documentElement.setAttribute('data-theme', 'dark');
              localStorage.setItem('nav-dark-mode', 'dark');
              btn.textContent = '☀️';
            }
          });
        });
      })();
    </script>
    <script>
      // Slash key focuses search
      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && !['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) {
          e.preventDefault();
          document.getElementById('searchInput')?.focus();
        }
      });
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.I18n) {
          I18n.init();
        }
      });
    </script>
  </body>
</html>
